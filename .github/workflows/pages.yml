# Tests en cada pull request y publicación en GitHub Pages al fusionar a main (S11, L39).
# El sitio publicado contiene solo los archivos públicos: index.html, css/ y los assets que usa la página.
name: Tests y GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo archivos públicos)
        run: |
          mkdir -p _site/css _site/assets/img
          cp index.html _site/
          cp css/styles.css _site/css/
          cp assets/favicon.svg _site/assets/
          cp assets/img/pueyrredon-panorama.jpg assets/img/gran-logia-argentina.png _site/assets/img/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
